<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý sản phẩm - SecurePortal</title>
<link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/example3.css}"></head><body>
<div th:replace="~{fragments/header :: header}"></div><main class="main-content"><div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div><div class="page-heading"><div><p class="hint" th:text="|Bạn sở hữu ${ownCount} sản phẩm|"></p><h1>Quản lý sản phẩm</h1><p sec:authorize="hasRole('ADMIN')">Quản trị viên có thể quản lý sản phẩm của mọi người dùng.</p></div><a class="btn btn-primary" th:href="@{/products/create}">+ Thêm sản phẩm</a></div><form class="search-form" th:action="@{/products}" method="get"><label class="sr-only" for="keyword">Từ khóa</label><input class="form-control" id="keyword" name="keyword" th:value="${keyword}" placeholder="Tên sản phẩm hoặc mô tả…"><label for="size">Mỗi trang</label><select id="size" name="size" class="form-control"><option th:each="n : ${ {5,10,20,50} }" th:value="${n}" th:text="${n}" th:selected="${size == n}"></option></select><button class="btn btn-outline">Tìm kiếm</button><a th:href="@{/products}">Xóa lọc</a></form><section class="card table-responsive"><table class="table"><thead><tr><th>ID</th><th>Ảnh</th><th>Tên sản phẩm</th><th>Giá</th><th>Chủ sở hữu</th><th>Thao tác</th></tr></thead><tbody>
<tr th:each="p : ${products.content}"><td th:text="${p.id}"></td><td><img th:if="${p.imageUrl != null}" th:src="${p.imageUrl}" th:alt="${p.name}" class="product-thumb"><span th:unless="${p.imageUrl != null}">Chưa có ảnh</span></td><td th:text="${p.name}"></td><td th:text="|${#numbers.formatDecimal(p.price,1,'POINT',2,'COMMA')} ₫|"></td><td th:text="${p.username}"></td><td><div class="row-actions"><a th:href="@{/products/edit/{id}(id=${p.id})}">Sửa</a><form th:action="@{/products/delete/{id}(id=${p.id})}" method="post" onsubmit="return confirm('Xóa sản phẩm này?')"><button class="delete-button">Xóa</button></form></div></td></tr>
<tr th:if="${products.empty}"><td colspan="6">Chưa có sản phẩm phù hợp. Thêm sản phẩm đầu tiên của bạn.</td></tr></tbody></table></section><nav class="pagination" aria-label="Phân trang"><a class="btn btn-outline" th:if="${products.hasPrevious()}" th:href="@{/products(page=${products.number-1},size=${size},keyword=${keyword})}">← Trước</a><span th:text="|Trang ${products.number+1} / ${products.totalPages == 0 ? 1 : products.totalPages} · ${products.totalElements} kết quả|"></span><a class="btn btn-outline" th:if="${products.hasNext()}" th:href="@{/products(page=${products.number+1},size=${size},keyword=${keyword})}">Sau →</a></nav></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
