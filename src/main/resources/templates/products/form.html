<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thông tin sản phẩm - SecurePortal</title>
<link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/example3.css}"></head><body>
<div th:replace="~{fragments/header :: header}"></div><main class="main-content"><section class="card edit-card"><h1 th:text="${mode == 'create' ? 'Thêm sản phẩm' : 'Sửa sản phẩm'}"></h1>
<form th:object="${productDTO}" th:action="${mode == 'create'} ? @{/products/create} : @{/products/edit/{id}(id=${productDTO.id})}" method="post" enctype="multipart/form-data"><div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert"><ul><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul></div><div class="form-group"><label class="form-label" for="name">Tên sản phẩm</label><input class="form-control" id="name" type="text" th:field="*{name}" maxlength="200" required></div>
<div class="form-group"><label class="form-label" for="description">Mô tả</label><textarea class="form-control" id="description" rows="5" th:field="*{description}" maxlength="4000"></textarea></div><div class="form-group"><label class="form-label" for="price">Giá (VNĐ)</label><input class="form-control" id="price" type="number" th:field="*{price}" step="0.01" min="0" max="9999999999999999.99" required></div>
<div class="form-group"><label class="form-label" for="image">Ảnh sản phẩm</label><input class="form-control" type="file" name="image" id="image" accept="image/png,image/jpeg,image/gif"><small>PNG, JPEG, GIF; tối đa 10 MB. Để trống khi muốn giữ ảnh hiện tại.</small></div>
<img th:if="${productDTO.imageUrl != null}" th:src="${productDTO.imageUrl}" alt="Ảnh sản phẩm hiện tại" class="product-preview"><div class="row-actions"><button class="btn btn-primary">Lưu sản phẩm</button><a class="btn btn-outline" th:href="@{/products}">Hủy</a></div></form></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
