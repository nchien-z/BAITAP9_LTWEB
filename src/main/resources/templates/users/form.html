<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thông tin người dùng - SecurePortal</title>
<link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/example3.css}"></head><body>
<div th:replace="~{fragments/header :: header}"></div><main class="main-content"><section class="card edit-card"><h1 th:text="${mode == 'create' ? 'Thêm người dùng' : 'Sửa người dùng'}"></h1>
<form th:object="${userDTO}" th:action="${mode == 'create'} ? @{/users/create} : @{/users/edit/{id}(id=${userDTO.id})}" method="post"><div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert"><ul><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul></div><div class="form-group"><label class="form-label" for="username">Tên đăng nhập</label><input class="form-control" id="username" type="text" th:field="*{username}" maxlength="60" pattern="[a-zA-Z0-9_.-]{3,60}" required></div><div class="form-group"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" th:field="*{email}" maxlength="150" autocomplete="email" required></div><div class="form-group"><label class="form-label" for="fullName">Họ và tên</label><input class="form-control" id="fullName" type="text" th:field="*{fullName}" maxlength="200" required></div>
<div class="form-group"><label class="form-label" for="roleName">Vai trò</label><select id="roleName" class="form-control" th:field="*{roleName}"><option value="ROLE_USER">USER</option><option value="ROLE_ADMIN">ADMIN</option></select></div>
<label class="checkbox-label"><input type="checkbox" th:field="*{enabled}"> Cho phép đăng nhập</label><p class="hint" th:if="${mode == 'create'}">Mật khẩu ban đầu: 123456. Người dùng có thể đặt lại qua email.</p><div class="row-actions"><button class="btn btn-primary">Lưu người dùng</button><a class="btn btn-outline" th:href="@{/users}">Hủy</a></div></form></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
