<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý người dùng - SecurePortal</title>
<link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/example3.css}"></head><body>
<div th:replace="~{fragments/header :: header}"></div><main class="main-content"><div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div><div class="page-heading"><div><p class="hint">QUẢN TRỊ VIÊN</p><h1>Quản lý người dùng</h1></div><a class="btn btn-primary" th:href="@{/users/create}">+ Thêm người dùng</a></div><form class="search-form" th:action="@{/users}" method="get"><label class="sr-only" for="keyword">Từ khóa</label><input class="form-control" id="keyword" name="keyword" th:value="${keyword}" placeholder="Tên đăng nhập, email, họ tên…"><label for="size">Mỗi trang</label><select id="size" name="size" class="form-control"><option th:each="n : ${ {5,10,20,50} }" th:value="${n}" th:text="${n}" th:selected="${size == n}"></option></select><button class="btn btn-outline">Tìm kiếm</button><a th:href="@{/users}">Xóa lọc</a></form><section class="card table-responsive"><table class="table"><thead><tr><th>ID</th><th>Họ tên</th><th>Tên đăng nhập</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Sản phẩm</th><th>Thao tác</th></tr></thead><tbody>
<tr th:each="u : ${users.content}"><td th:text="${u.id}"></td><td th:text="${u.fullName}"></td><td th:text="${u.username}"></td><td th:text="${u.email}"></td><td th:text="${u.roleName}"></td><td th:text="${u.enabled ? 'Hoạt động' : 'Chưa kích hoạt / bị khóa'}"></td><td th:text="${u.productCount}"></td><td><div class="row-actions"><a th:href="@{/users/edit/{id}(id=${u.id})}">Sửa</a><form th:action="@{/users/delete/{id}(id=${u.id})}" method="post" onsubmit="return confirm('Xóa người dùng này?')"><button class="delete-button">Xóa</button></form></div></td></tr>
<tr th:if="${users.empty}"><td colspan="8">Không có người dùng phù hợp.</td></tr></tbody></table></section><nav class="pagination" aria-label="Phân trang"><a class="btn btn-outline" th:if="${users.hasPrevious()}" th:href="@{/users(page=${users.number-1},size=${size},keyword=${keyword})}">← Trước</a><span th:text="|Trang ${users.number+1} / ${users.totalPages == 0 ? 1 : users.totalPages} · ${users.totalElements} kết quả|"></span><a class="btn btn-outline" th:if="${users.hasNext()}" th:href="@{/users(page=${users.number+1},size=${size},keyword=${keyword})}">Sau →</a></nav></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
