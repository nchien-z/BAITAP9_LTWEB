<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xác nhận email - SecurePortal</title>
<link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/example3.css}"></head><body>
<div th:replace="~{fragments/header :: header}"></div><div class="auth-wrapper"><section class="auth-card"><h1>Xác nhận email</h1><div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div><form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post"><div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert"><ul><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul></div><div class="form-group"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" th:field="*{email}" maxlength="150" autocomplete="email" required></div><div class="form-group"><label class="form-label" for="otp">Mã OTP 6 số</label><input class="form-control" id="otp" type="text" th:field="*{otp}" pattern="[0-9]{6}" maxlength="6" inputmode="numeric" autocomplete="one-time-code" required></div><button class="btn btn-primary" type="submit">Xác nhận</button></form><p class="hint">OTP có hiệu lực 5 phút, tối đa 5 lần thử.</p><form th:action="@{/resend-register-otp}" method="post" class="resend-form"><label for="resend-email">Email cần gửi lại OTP</label><input class="form-control" id="resend-email" name="email" type="email" th:value="${verifyOtpDTO.email}" required maxlength="150"><button class="btn btn-outline">Gửi lại OTP</button><small>Đợi ít nhất 60 giây giữa các lần gửi.</small></form><p class="auth-links"><a th:href="@{/login}">Quay lại đăng nhập</a></p></section></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
