<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký tài khoản - SecurePortal</title>
<link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/example3.css}"></head><body>
<div th:replace="~{fragments/header :: header}"></div><div class="auth-wrapper"><section class="auth-card"><h1>Đăng ký tài khoản</h1><div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div><form th:action="@{/register}" th:object="${registerDTO}" method="post"><div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert"><ul><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul></div><div class="form-group"><label class="form-label" for="username">Tên đăng nhập</label><input class="form-control" id="username" type="text" th:field="*{username}" pattern="[a-zA-Z0-9_.-]{3,60}" maxlength="60" autocomplete="username" required></div><div class="form-group"><label class="form-label" for="fullName">Họ và tên</label><input class="form-control" id="fullName" type="text" th:field="*{fullName}" maxlength="200" autocomplete="name" required></div><div class="form-group"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" th:field="*{email}" maxlength="150" autocomplete="email" required></div><div class="form-group"><label class="form-label" for="password">Mật khẩu</label><input class="form-control" id="password" type="password" th:field="*{password}" minlength="6" maxlength="72" autocomplete="new-password" required></div><div class="form-group"><label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label><input class="form-control" id="confirmPassword" type="password" th:field="*{confirmPassword}" minlength="6" maxlength="72" autocomplete="new-password" required></div><button class="btn btn-primary" type="submit">Đăng ký và nhận OTP</button></form><p class="auth-links"><a th:href="@{/verify-otp}">Đã đăng ký nhưng chưa xác thực?</a></p><p class="auth-links"><a th:href="@{/login}">Quay lại đăng nhập</a></p></section></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
