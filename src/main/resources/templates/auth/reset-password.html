<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đặt lại mật khẩu - SecurePortal</title>
<link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/example3.css}"></head><body>
<div th:replace="~{fragments/header :: header}"></div><div class="auth-wrapper"><section class="auth-card"><h1>Đặt lại mật khẩu</h1><div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div><form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post"><div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert"><ul><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul></div><div class="form-group"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" th:field="*{email}" maxlength="150" autocomplete="email" required></div><div class="form-group"><label class="form-label" for="otp">Mã OTP 6 số</label><input class="form-control" id="otp" type="text" th:field="*{otp}" pattern="[0-9]{6}" maxlength="6" inputmode="numeric" autocomplete="one-time-code" required></div><div class="form-group"><label class="form-label" for="password">Mật khẩu mới</label><input class="form-control" id="password" type="password" th:field="*{password}" minlength="6" maxlength="72" autocomplete="new-password" required></div><div class="form-group"><label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label><input class="form-control" id="confirmPassword" type="password" th:field="*{confirmPassword}" minlength="6" maxlength="72" autocomplete="new-password" required></div><button class="btn btn-primary" type="submit">Đổi mật khẩu</button></form><p class="auth-links"><a th:href="@{/forgot-password}">Gửi lại OTP đặt mật khẩu</a></p><p class="auth-links"><a th:href="@{/login}">Quay lại đăng nhập</a></p></section></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
