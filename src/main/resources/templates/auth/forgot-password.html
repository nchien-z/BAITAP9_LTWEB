<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quên mật khẩu - SecurePortal</title>
<link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/example3.css}"></head><body>
<div th:replace="~{fragments/header :: header}"></div><div class="auth-wrapper"><section class="auth-card"><h1>Quên mật khẩu</h1><div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div><form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post"><div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert"><ul><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul></div><div class="form-group"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" th:field="*{email}" maxlength="150" autocomplete="email" required></div><button class="btn btn-primary" type="submit">Gửi OTP đặt lại mật khẩu</button></form><p class="auth-links"><a th:href="@{/login}">Quay lại đăng nhập</a></p></section></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
